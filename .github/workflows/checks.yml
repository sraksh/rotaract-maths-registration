name: Checks (lint, type-check, build)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    env:
      # PUBLIC values only. Set them under Settings → Secrets and variables → Actions → Variables.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Hosted on Netlify at the site root. (For a GitHub Pages project site use /<repo>/.)
      VITE_BASE_PATH: /
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refuse a secret key in the public build
        run: |
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY looks like a SECRET key. Use the publishable key."; exit 1 ;;
          esac

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build static site
        run: npm run build
