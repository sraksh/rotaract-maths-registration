# Netlify build settings. Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY
# (public values only — NEVER the secret/service-role key) in Netlify:
#   Site configuration → Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Served from the site root, so no sub-path (unlike GitHub Pages project sites).
  VITE_BASE_PATH = "/"

# The app uses hash routing (#/admin), so no SPA redirect rules are needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
